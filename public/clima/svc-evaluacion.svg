<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Evaluación Clima">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103B4D"/>
      <stop offset="1" stop-color="#06202B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.12" r="0.78">
      <stop offset="0" stop-color="#3BBECC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3BBECC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1C8795"/><stop offset="1" stop-color="#2BA6B4"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2BA6B4"/><stop offset="1" stop-color="#3BBECC"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3BBECC"/><stop offset="1" stop-color="#8FDCE5"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bg)"/>
  <rect width="400" height="300" fill="url(#glow)"/>

  <!-- eje -->
  <path d="M60 240 L330 240" stroke="#3BBECC" stroke-opacity="0.3" stroke-width="2.5" stroke-linecap="round"/>

  <!-- barras -->
  <rect x="72" y="176" width="46" height="64" rx="10" fill="url(#b1)"/>
  <rect x="134" y="134" width="46" height="106" rx="10" fill="url(#b2)"/>
  <rect x="196" y="94" width="46" height="146" rx="10" fill="url(#b3)"/>

  <!-- linea de tendencia -->
  <path d="M95 162 L157 120 L219 80" fill="none" stroke="#EAF8FA" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 8"/>
  <circle cx="219" cy="80" r="7" fill="#EAF8FA"/>

  <!-- carita de resultado -->
  <circle cx="306" cy="150" r="50" fill="#3BBECC"/>
  <circle cx="306" cy="150" r="50" fill="none" stroke="#8FDCE5" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="290" cy="138" r="6.5" fill="#06202B"/>
  <circle cx="322" cy="138" r="6.5" fill="#06202B"/>
  <path d="M284 164 C293 180 319 180 328 164" fill="none" stroke="#06202B" stroke-width="7.5" stroke-linecap="round"/>
</svg>
