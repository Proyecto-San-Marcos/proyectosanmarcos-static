      <stop offset="1" stop-color="#06202B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.14" r="0.75">
      <stop offset="0" stop-color="#3BBECC" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#3BBECC" stop-opacity="0"/>
