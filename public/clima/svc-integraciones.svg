    <rect x="276" y="34" width="10" height="10" rx="2.5" fill="#BDEBF1" transform="rotate(32 281 39)"/>
    <rect x="344" y="78" width="9" height="9" rx="2" fill="#3BBECC" transform="rotate(-25 348 82)"/>
    <circle cx="86" cy="104" r="5" fill="#3BBECC"/>
    <circle cx="330" cy="150" r="5.5" fill="#8FDCE5"/>
    <circle cx="204" cy="34" r="4.5" fill="#BDEBF1"/>
  </g>

  <!-- arco de union -->
