<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-label="Integraciones">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#103B4D"/>
      <stop offset="1" stop-color="#06202B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#3BBECC" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3BBECC" stop-opacity="0"/>
